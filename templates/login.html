{% extends "base.html" %}
{% block title %}Login — Combat Analyzer Pro{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
  <div class="max-w-md w-full space-y-8">

    <!-- Logo -->
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-navy-900">⚔️ Combat Analyzer Pro</h1>
      <p class="mt-2 text-gray-600">Plataforma táctica para entrenadores de combate</p>
    </div>

    <!-- Card login -->
    <div class="card p-8" x-data="loginForm()">

      <h2 class="text-xl font-bold text-gray-800 mb-6">Acceder a tu cuenta</h2>

      <!-- Error -->
      <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4" x-text="error"></div>

      <!-- Form -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" x-model="email" placeholder="tu@email.com"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-navy-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" x-model="password" placeholder="••••••••"
            @keydown.enter="submit()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-navy-500">
        </div>

        <button @click="submit()" :disabled="loading"
          class="w-full btn-primary py-3 text-base font-semibold">
          <span x-show="!loading">Entrar</span>
          <span x-show="loading">Verificando...</span>
        </button>
      </div>

      <!-- Registro -->
      <div class="mt-6 text-center text-sm text-gray-600">
        ¿No tienes cuenta?
        <a href="/register" class="text-navy-700 font-semibold hover:underline">Crear cuenta gratis</a>
      </div>

    </div>
  </div>
</div>

<script>
function loginForm() {
  return {
    email: '',
    password: '',
    loading: false,
    error: '',

    async submit() {
      this.error = '';
      if (!this.email || !this.password) {
        this.error = 'Completa todos los campos';
        return;
      }
      this.loading = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: this.email, password: this.password})
        });
        const data = await r.json();
        if (!r.ok) {
          this.error = data.detail || 'Error al iniciar sesión';
        } else {
          window.location.href = '/';
        }
      } catch(e) {
        this.error = 'Error de conexión';
      } finally {
        this.loading = false;
      }
    }
  }
}
</script>
{% endblock %}
