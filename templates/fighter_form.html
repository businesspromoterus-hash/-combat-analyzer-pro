{% extends "base.html" %}
{% block title %}Nuevo peleador - Combat Analyzer Pro{% endblock %}

{% block content %}
<div x-data="fighterForm()" x-init="init()" @fighter-autofill="applyAutofill($event.detail)">
  <div class="mb-6 flex items-center gap-3">
    <a href="/" class="text-navy-700 hover:underline">← Inicio</a>
  </div>

  <div class="card p-8 max-w-3xl mx-auto">
    <h1 class="text-2xl font-extrabold text-navy-900 mb-1">Nuevo peleador</h1>
    <p class="text-gray-600 mb-6">Datos básicos para construir el perfil táctico.</p>

    <form @submit.prevent="submit()" class="space-y-5">

      {% include "fighter_search_widget.html" %}

      <!-- Rol -->
      <div>
        <label class="label">¿Quién es este peleador?</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" @click="form.role = 'our'"
                  :class="form.role === 'our' ? 'border-navy-900 bg-navy-900 text-white' : 'border-gray-300 bg-white text-gray-700'"
                  class="border-2 rounded-md p-3 font-bold transition">
            🥊 Nuestro peleador
          </button>
          <button type="button" @click="form.role = 'opponent'"
                  :class="form.role === 'opponent' ? 'border-blood-500 bg-blood-500 text-white' : 'border-gray-300 bg-white text-gray-700'"
                  class="border-2 rounded-md p-3 font-bold transition">
            🎯 Oponente
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label">Nombre completo *</label>
          <input x-model="form.name" required class="input" placeholder="Ej. Juan Pérez">
        </div>
        <div>
          <label class="label">Disciplina *</label>
          <select x-model="form.sport" required class="input" @change="syncDivisionSelect()">
            <option value="boxing">Boxeo</option>
            <option value="mma">MMA</option>
            <option value="bkfc">BKFC — Bare Knuckle</option>
            <option value="kickboxing">Kickboxing</option>
            <option value="muay_thai">Muay Thai</option>
            <option value="bjj">BJJ — Brazilian Jiu-Jitsu</option>
            <option value="judo">Judo</option>
            <option value="karate">Karate</option>
            <option value="karate_combat">Karate Combat</option>
            <option value="taekwondo">Taekwondo</option>
            <option value="wrestling">Lucha</option>
            <option value="other">Otro</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <label class="label">Edad</label>
          <input type="number" x-model.number="form.age" class="input" min="10" max="80">
        </div>
        <div>
          <label class="label">Peso</label>
          <div class="flex gap-1">
            <input type="number" x-model.number="weightDisplay" @input="onWeightInput()"
                   class="input" step="0.1" min="0"
                   :placeholder="weightUnit === 'kg' ? 'kg' : 'lb'">
            <div class="flex rounded-md border border-gray-300 overflow-hidden shrink-0">
              <button type="button" @click="setWeightUnit('kg')"
                      :class="weightUnit === 'kg' ? 'bg-navy-900 text-white' : 'bg-white text-gray-700'"
                      class="px-2 text-sm font-semibold">kg</button>
              <button type="button" @click="setWeightUnit('lb')"
                      :class="weightUnit === 'lb' ? 'bg-navy-900 text-white' : 'bg-white text-gray-700'"
                      class="px-2 text-sm font-semibold">lb</button>
            </div>
          </div>
        </div>
        <div>
          <label class="label">Estatura (cm)</label>
          <input type="number" x-model.number="form.height_cm" class="input">
        </div>
        <div>
          <label class="label">Alcance (cm)</label>
          <input type="number" x-model.number="form.reach_cm" class="input">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="label">División</label>
          <select x-show="divisionOptions.length" x-model="divisionSelect"
                  @change="onDivisionSelect()" class="input">
            <option value="">Selecciona división...</option>
            <template x-for="d in divisionOptions" :key="d">
              <option :value="d" x-text="d"></option>
            </template>
            <option value="__custom__">— Otra / personalizada —</option>
          </select>
          <input x-show="!divisionOptions.length || divisionCustom"
                 x-model="form.division" class="input"
                 :class="(divisionOptions.length && divisionCustom) ? 'mt-2' : ''"
                 placeholder="Ej. -73 kg, Catchweight, Openweight">
        </div>
        <div>
          <label class="label">Guardia</label>
          <select x-model="form.stance" class="input">
            <option value="orthodox">Diestro (orthodox)</option>
            <option value="southpaw">Zurdo (southpaw)</option>
            <option value="switch">Switch</option>
            <option value="na">N/A (judo, lucha)</option>
          </select>
        </div>
        <div>
          <label class="label">País</label>
          <input x-model="form.country" class="input" placeholder="Ej. México">
        </div>
      </div>

      <!-- Récord -->
      <div>
        <label class="label">Récord</label>
        <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
          <div>
            <label class="text-xs text-gray-500">Victorias</label>
            <input type="number" x-model.number="form.wins" class="input" min="0">
          </div>
          <div>
            <label class="text-xs text-gray-500">Derrotas</label>
            <input type="number" x-model.number="form.losses" class="input" min="0">
          </div>
          <div>
            <label class="text-xs text-gray-500">Empates</label>
            <input type="number" x-model.number="form.draws" class="input" min="0">
          </div>
          <div>
            <label class="text-xs text-gray-500">KOs</label>
            <input type="number" x-model.number="form.ko_wins" class="input" min="0">
          </div>
          <div>
            <label class="text-xs text-gray-500">Subs</label>
            <input type="number" x-model.number="form.sub_wins" class="input" min="0">
          </div>
          <div>
            <label class="text-xs text-gray-500">Ippons</label>
            <input type="number" x-model.number="form.ippon_wins" class="input" min="0">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label">Experiencia profesional (años)</label>
          <input type="number" x-model.number="form.years_experience_pro" class="input" min="0" max="70">
        </div>
        <div>
          <label class="label">Experiencia amateur (años)</label>
          <input type="number" x-model.number="form.years_experience_amateur" class="input" min="0" max="70">
        </div>
      </div>

      <div>
        <label class="label">Notas relevantes</label>
        <textarea x-model="form.notes" class="input" rows="3"
                  placeholder="Lesiones previas, cambios de equipo, etc."></textarea>
      </div>

      <div x-show="error" x-cloak class="bg-red-50 border border-red-300 text-red-700 p-3 rounded">
        <span x-text="error"></span>
      </div>

      <div class="flex gap-3 pt-3">
        <button type="submit" :disabled="loading"
                class="btn-primary disabled:opacity-50">
          <span x-show="!loading">Crear peleador</span>
          <span x-show="loading">Guardando...</span>
        </button>
        <a href="/" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script>
function fighterForm() {
  return {
    loading: false,
    error: '',
    // Selector de unidad de peso. form.weight_kg es siempre el valor canónico (kg);
    // weightDisplay es lo que ve el entrenador en la unidad elegida.
    weightUnit: 'kg',
    weightDisplay: null,
    // Selector de división. divisionSelect controla el <select>; si el
    // entrenador elige "Otra" (o el deporte no tiene divisiones estándar),
    // divisionCustom revela un campo de texto libre. form.division es el valor real.
    divisionSelect: '',
    divisionCustom: false,
    BOXING_DIVISIONS: [
      'Minimumweight', 'Light Flyweight', 'Flyweight', 'Super Flyweight',
      'Bantamweight', 'Super Bantamweight', 'Featherweight', 'Super Featherweight',
      'Lightweight', 'Super Lightweight', 'Welterweight', 'Super Welterweight',
      'Middleweight', 'Super Middleweight', 'Light Heavyweight', 'Cruiserweight',
      'Heavyweight',
    ],
    MMA_DIVISIONS: [
      'Flyweight (125 lb)', 'Bantamweight (135 lb)', 'Featherweight (145 lb)',
      'Lightweight (155 lb)', 'Welterweight (170 lb)', 'Middleweight (185 lb)',
      'Light Heavyweight (205 lb)', 'Heavyweight (265 lb)',
      "Women's Strawweight (115 lb)", "Women's Flyweight (125 lb)",
      "Women's Bantamweight (135 lb)", "Women's Featherweight (145 lb)",
    ],
    form: {
      role: 'our',
      name: '',
      sport: 'boxing',
      country: '',
      age: null,
      weight_kg: null,
      division: '',
      height_cm: null,
      reach_cm: null,
      stance: 'orthodox',
      wins: 0, losses: 0, draws: 0,
      ko_wins: 0, sub_wins: 0, ippon_wins: 0,
      years_experience: null,
      years_experience_pro: null,
      years_experience_amateur: null,
      notes: '',
    },
    init() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('role') === 'opponent') this.form.role = 'opponent';
    },
    // ── Conversión de peso kg/lb ─────────────────────────────────────────
    onWeightInput() {
      if (this.weightDisplay === null || this.weightDisplay === '' || isNaN(this.weightDisplay)) {
        this.form.weight_kg = null;
        return;
      }
      const kg = this.weightUnit === 'kg'
        ? this.weightDisplay
        : this.weightDisplay * 0.45359237;
      this.form.weight_kg = Math.round(kg * 10) / 10;
    },
    // ── Selector de división ─────────────────────────────────────────────
    get divisionOptions() {
      const s = this.form.sport;
      if (s === 'boxing' || s === 'bkfc') return this.BOXING_DIVISIONS;
      if (s === 'mma') return this.MMA_DIVISIONS;
      return [];
    },
    onDivisionSelect() {
      if (this.divisionSelect === '__custom__') {
        this.divisionCustom = true;
        this.form.division = '';
      } else {
        this.divisionCustom = false;
        this.form.division = this.divisionSelect;
      }
    },
    syncDivisionSelect() {
      const opts = this.divisionOptions;
      if (!opts.length) {
        this.divisionCustom = false;
        this.divisionSelect = '';
      } else if (this.form.division && opts.includes(this.form.division)) {
        this.divisionSelect = this.form.division;
        this.divisionCustom = false;
      } else if (this.form.division) {
        this.divisionSelect = '__custom__';
        this.divisionCustom = true;
      } else {
        this.divisionSelect = '';
        this.divisionCustom = false;
      }
    },
    setWeightUnit(unit) {
      if (unit === this.weightUnit) return;
      this.weightUnit = unit;
      this.syncWeightDisplay();
    },
    syncWeightDisplay() {
      if (this.form.weight_kg === null || this.form.weight_kg === undefined || this.form.weight_kg === '') {
        this.weightDisplay = null;
        return;
      }
      const val = this.weightUnit === 'kg'
        ? this.form.weight_kg
        : this.form.weight_kg / 0.45359237;
      this.weightDisplay = Math.round(val * 10) / 10;
    },
    // Aplica los datos encontrados por el buscador automático al formulario.
    // El entrenador puede editar cualquier campo antes de guardar.
    applyAutofill(r) {
      if (!r) return;
      const copy = (k) => {
        if (r[k] !== null && r[k] !== undefined && r[k] !== '') this.form[k] = r[k];
      };
      ['name', 'country', 'age', 'weight_kg', 'division',
       'height_cm', 'reach_cm', 'years_experience',
       'years_experience_pro', 'years_experience_amateur'].forEach(copy);
      // Récord del peleador (victorias/derrotas/empates/KOs/sumisiones)
      ['wins', 'losses', 'draws', 'ko_wins', 'sub_wins'].forEach(copy);
      if (r.sport) this.form.sport = r.sport;
      if (r.stance) this.form.stance = r.stance;
      this.syncWeightDisplay();
      this.syncDivisionSelect();

      // Construir notas con la inteligencia táctica encontrada
      let notes = '';
      if (r.style_summary) notes += `Estilo: ${r.style_summary}\n\n`;
      if (r.known_strengths?.length) notes += `Fortalezas conocidas:\n${r.known_strengths.map(s => `• ${s}`).join('\n')}\n\n`;
      if (r.known_weaknesses?.length) notes += `Debilidades conocidas:\n${r.known_weaknesses.map(w => `• ${w}`).join('\n')}\n\n`;
      if (r.current_trainer) notes += `Entrenador: ${r.current_trainer}\n`;
      if (r.gym) notes += `Gimnasio: ${r.gym}\n`;
      if (r.source_notes) notes += `\nFuente: ${r.source_notes}`;
      if (notes) this.form.notes = notes.trim();
    },
    async submit() {
      this.error = '';
      this.loading = true;
      try {
        const payload = { ...this.form };
        Object.keys(payload).forEach(k => {
          if (payload[k] === '' || payload[k] === null) delete payload[k];
        });
        const res = await fetch('/api/fighters', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(JSON.stringify(err.detail || err));
        }
        const fighter = await res.json();
        window.location.href = `/fighters/${fighter.id}`;
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    },
  };
}
</script>
{% endblock %}
